name: MRB seat trailer

# FR #92: remind authors to declare Seat: nick (required for mrb/verdict).
# Does not replace branch protection — Simon must require check mrb/verdict.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [main]

jobs:
  seat-trailer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Require Seat: trailer in PR body
        env:
          BODY: ${{ github.event.pull_request.body || '' }
        run: |
          python - <<'PY'
          import os, re, sys
          body = os.environ.get("BODY") or ""
          if not re.search(r"(?im)^\s*Seat:\s*[A-Za-z0-9]", body):
              print("::error::PR body must include a line: Seat: {your-irc-nick}")
              print("FR #92 — author seat for mrb/verdict gate. See docs/mrb-enforcement.md")
              sys.exit(1)
          print("Seat: trailer ok")
          PY
