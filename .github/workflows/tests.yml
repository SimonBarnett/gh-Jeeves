name: Full test suite

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Full pytest (tests/)
        run: python -m pytest tests/ -q
        env:
          PYTHONPATH: src
