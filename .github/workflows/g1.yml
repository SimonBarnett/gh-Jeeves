name: G1 token-less gate

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  g1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: G1 pytest
        run: pytest -q tests/g1_token_less_e2e
